site_name: promptlock
site_description: Content-addressed registry and drift gate for prompts
repo_url: https://git.c01n31.net/c01n31pan1c/promptlock
edit_uri: -/edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: light mode}
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Install: install.md
  - Using it:
    - CI: ci.md
    - Against a deployment: deployed.md
    - Templates: templates.md
    - Diffing: diff.md
    - Sources: sources.md
    - Performance: performance.md
  - Hashing:
    - Canonical form: canon.md
    - Three hashes: hashes.md
    - Unicode: unicode.md
    - Migrating: migrating.md
  - Evals:
    - Binding a result: evals.md
    - With promptfuzz: promptfuzz.md
    - Reporting: reporting.md
  - Project:
    - Stability: stability.md
    - Signing: signing.md
    - What this depends on: supply-chain.md
    - How it fails open: failing-open.md
    - Changes I cannot make casually: changing-this.md
    - Releasing: releasing.md
    - Why not git: why-not-git.md
    - FAQ: faq.md
