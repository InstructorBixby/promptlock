# Runs on the docker runner registered on this box.
stages:
  - test
  - selfcheck
  - release

cache:
  key:
    files:
      - pyproject.toml
      - constraints-dev.txt
  paths:
    - .cache/uv

variables:
  UV_CACHE_DIR: .cache/uv

test:
  stage: test
  image: python:$PYVER
  parallel:
    matrix:
      - PYVER: ["3.11", "3.12", "3.13"]
  script:
    - pip install uv
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt
    - ruff check .
    - mypy
    - pytest -q --cov=promptlock --cov-report=term-missing --cov-fail-under=90

# GitLab CE has no dependency bot and I am not going to run one. A scheduled
# pipeline that installs the dev tooling WITHOUT the constraints tells me
# when an upstream release is going to cost me an afternoon, on a day I
# chose rather than in the middle of something else.
upstream:
  stage: test
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - pip install uv
    - uv pip install --system -e ".[dev]"
    - ruff check .
    - mypy
    - pytest -q
  allow_failure: true

# The no-runtime-dependencies rule is a design constraint, and a design
# constraint nothing checks is a preference. This fails the moment
# `dependencies` in pyproject.toml stops being empty, which is the only way
# I will notice myself adding one at four in the afternoon.
no-runtime-deps:
  stage: test
  image: python:3.12
  script:
    - |
      python - <<'PY'
      import sys, tomllib
      with open("pyproject.toml", "rb") as fh:
          deps = tomllib.load(fh)["project"].get("dependencies") or []
      if deps:
          sys.exit(f"runtime dependencies appeared: {deps}")
      PY
    - pip install uv
    - uv pip install --system .
    # Installed with nothing else in the environment, it still has to run.
    - promptlock --version
    - promptlock verify

# This repository keeps its own example prompts in a registry, so the
# gate can be run against itself. It has caught two regressions that
# the unit tests did not.
selfcheck:
  stage: selfcheck
  image: python:3.12
  script:
    - pip install uv
    - uv pip install --system -e "."
    - promptlock verify
    - promptlock check
    - promptlock fmt --check
    - promptlock status

# A tag builds the wheel. Nothing publishes it; the artefact is the
# distribution channel and I am the distribution.
release:
  stage: release
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - pip install uv
    # The tag and the packaged version have to agree, and the one time they
    # did not I installed a wheel that called itself the previous release.
    # Check before building, not after.
    - |
      tag="${CI_COMMIT_TAG#v}"
      pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
      test "$tag" = "$pkg" || { echo "tag $tag != pyproject $pkg"; exit 1; }
    - uv pip install --system -e ".[dev]"
    - ruff check .
    - mypy
    - pytest -q
    - uv pip install --system build
    - python -m build
    - |
      {
        echo "commit $CI_COMMIT_SHA"
        echo "tag $CI_COMMIT_TAG"
        sha256sum dist/*
      } | tee dist/BUILDINFO
  artifacts:
    paths:
      - dist/
    expire_in: never
