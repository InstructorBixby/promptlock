[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlock"
version = "0.2.0"
description = "Content-addressed registry and drift gate for prompts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
[project.scripts]
promptlock = "promptlock.cli:main"

[tool.setuptools.packages.find]
include = ["promptlock*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
