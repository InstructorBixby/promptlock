[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlock"
version = "1.2.0"
description = "Content-addressed registry and drift gate for prompts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = []

keywords = ["prompt", "llm", "security", "supply-chain", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Source = "https://git.c01n31.net/c01n31pan1c/promptlock"
Changelog = "https://git.c01n31.net/c01n31pan1c/promptlock/-/blob/main/CHANGELOG.md"
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
[project.scripts]
promptlock = "promptlock.commands.main:main"

[tool.setuptools.packages.find]
include = ["promptlock*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
promptlock = ["py.typed"]

[tool.mypy]
python_version = "3.11"
packages = ["promptlock"]
strict = true
# The command modules are argparse glue; annotating them to strict buys
# nothing and makes the modules that matter harder to read.
exclude = "promptlock/commands/"

[tool.coverage.run]
branch = true
source = ["promptlock"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
